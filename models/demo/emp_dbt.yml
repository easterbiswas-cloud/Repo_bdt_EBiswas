version: 2

models:
  - name: emp_dbt_model
    description: "employee dbt model"
    columns:
      - name: emp_id
        data_tests: 
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: [1,2,3,4]
              config:
                  severity: warn
      - name: salary
        data_tests:
          - salary_check
  - name: customer
    description: "customer bdt model"   
  - name: customer_vw
    description: "customer view bdt model"   
  - name: sales
    description: "dbt model for Sales_SRC"
  - name: product
    description: "DBT model for product"

sources:
  - name: emp_dbt_model
    database: DBT_EASTER_DB
    schema: DBT_EASTERBISWASCLOUD
    tables:
      - name: employees
  - name: customer
    database: DBT_EASTER_DB
    schema: DBT_EASTERBISWASCLOUD
    tables:
      - name: CUSTOMER_SRC
  - name: sales
    database: DBT_EASTER_DB
    schema: DBT_EASTERBISWASCLOUD
    tables: 
      - name: SALES_SRC
  - name: product
    database: DBT_EASTER_DB
    schema: DBT_EASTERBISWASCLOUD
    tables: 
      - name: PRODUCT_SRC
